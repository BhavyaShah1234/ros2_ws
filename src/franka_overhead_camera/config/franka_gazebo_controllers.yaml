# ros2_control controller set for the Gazebo simulation, loaded in place of
# franka_gazebo_bringup's own config/franka_gazebo_controllers.yaml (see
# redirect_controller_params() in franka_with_overhead_camera.launch.py,
# which rewrites the <parameters> path baked into franka_description's
# franka_arm.ros2_control.xacro to point here instead).
#
# franka_gazebo_bringup's config only defines the *_example_controllers,
# none of which accept any external command (JointPositionExampleController
# in particular just runs a fixed, hardcoded cosine-oscillation demo -- no
# subscriber, service, or action of any kind). To actually command the arm
# (e.g. to drive it along a planned path), joint_trajectory_controller is
# added here and is the one the launch file activates.
#
# command_interfaces is `position`, not `effort` like real-hardware/MoveIt
# configs (see franka_fr3_moveit_config/config/fr3_ros_controllers.yaml) --
# franka_gz_ros2_control/GZSystem only exports position/velocity command
# interfaces in Gazebo unless gazebo_effort:=true is set, which this setup
# doesn't use.
#
# The example controllers are kept here too (loaded, not activated) purely
# so nothing is lost if you want to switch back -- the launch file's
# event-handler chain only activates joint_trajectory_controller.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true

joint_impedance_example_controller:
  ros__parameters:
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5
