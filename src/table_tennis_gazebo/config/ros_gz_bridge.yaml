# Camera RGB image
- ros_topic_name: "fr3_arm_cam/image"
  gz_topic_name: "fr3_arm_cam/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

# Camera depth image
- ros_topic_name: "fr3_arm_cam/depth_image"
  gz_topic_name: "fr3_arm_cam/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: true

# Camera info
- ros_topic_name: "fr3_arm_cam/camera_info"
  gz_topic_name: "fr3_arm_cam/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

# Clock (shared with all components)
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: false
