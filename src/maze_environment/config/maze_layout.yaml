# 10x10 perfect maze generated with mazelib's BacktrackingGenerator
# (recursive backtracking DFS -- the same algorithm class
# mazegenerator.net's default "Perfect Maze" setting uses), since this
# session has no live browser access to the actual site. See
# franka_with_overhead_camera.launch.py for how it's rendered.
#
# Wall segments are stored in grid units (0..cells_per_side), NOT meters:
# franka_with_overhead_camera.launch.py maps this grid onto the square formed
# by the 3 corner points in camera_and_maze.yaml's maze section at launch
# time (grid x in [0, cells_per_side] -> world x in [min corner x, max
# corner x], same for y), so moving those points moves and rescales the
# maze with them.
#
# Entrance and exit are always on the pair of edges at y=y_min and y=y_max
# (never y=x_min/x_max), matching mazegenerator.net's "Starts at: Top" +
# opposite-edge exit convention: cell (0,0)'s boundary wall at y=y_min and
# cell (cells_per_side-1, cells_per_side-1)'s boundary wall at y=y_max are
# always the two forced open, regardless of the maze's random internal
# passages. With camera_and_maze.yaml's top_left/bottom_left/top_right
# corners as (x_min,y_max), (x_min,y_min), (x_max,y_max): entrance is at
# bottom_left's corner (min x, min y); exit is at top_right's corner
# (max x, max y) -- not the empty 4th corner, bottom_right (max x, min y).
maze:
  cells_per_side: 10
  wall_thickness_m: 0.006
  wall_height_m: 0.03
  segments_grid_units:
