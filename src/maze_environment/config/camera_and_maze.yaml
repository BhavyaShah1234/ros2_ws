# Scene layout: overhead camera pose, robot base pose, and maze corner
# calibration -- kept in one file since they all constrain each other (the
# camera must see the maze unobstructed by the arm, and the arm must reach
# every cell). See franka_with_overhead_camera.launch.py, which reads all
# three sections at launch time.

# Pose used to spawn the overhead camera. Applied via `ros_gz_sim create`'s
# -x/-y/-z/-R/-P/-Y flags, which unconditionally override any <pose> in
# models/overhead_camera/model.sdf -- so this file, not the SDF, is what
# actually controls where the camera ends up. Edits here take effect on the
# next `ros2 launch`, no rebuild needed.
overhead_camera:
  # Horizontal position, in meters, in the world frame.
  # x is centered over the maze's x-span (corners span x in [0.1, 0.7], so
  # midpoint 0.4) -- previously 0.8, well past the maze's far edge, which is
  # why the camera had to be tilted just to see the maze at all.
  x: 0.4
  y: 0.0

  # Height, in meters, is robot_height_m + clearance_m:
  #  - robot_height_m: highest point of the FR3 arm (the wrist cluster) in
  #    its default Gazebo spawn pose, from forward kinematics of
  #    franka_arm.ros2_control.xacro's baked-in initial joint values.
  #    Shouldn't need to change unless the robot's default pose does.
  #  - clearance_m: how far above that the camera sits. This is the knob to
  #    turn to change the camera's height/ground footprint. At pitch =
  #    straight down, the model.sdf's 640x480 sensor with horizontal_fov
  #    1.047 rad has a narrower *vertical* FOV (~46.8 deg, from the 4:3
  #    aspect ratio) than horizontal -- that's the binding constraint for
  #    fitting the maze's 0.6 x 0.6 m square in frame. Minimum height to
  #    fit it at all is ~0.69 m; 0.20 clearance (~0.90 m total) leaves
  #    margin around the edges.
  robot_height_m: 0.697
  clearance_m: 0.20

  # Orientation, in radians (roll, pitch, yaw). pitch = pi/2 (1.5707963)
  # points the camera's optical axis (local +X) straight down at the floor
  # -- true here now (previously set to 2.0944, an oblique tilt, which
  # combined with the off-center x above to see the maze at all, at the
  # cost of perspective distortion and near-side occlusion of far cells).
  # Change yaw to rotate the image; change roll/pitch away from this value
  # to tilt the view off-vertical.
  roll: 3.14159
  pitch: 1.5707963
  yaw: 0.0

# Mount pose of the FR3's base in the world frame (x/y/z in meters, yaw in
# radians; the robot faces +x at yaw 0). Applied by editing the URDF's
# `world_joint` origin (set_robot_base_pose() in the launch file) -- the
# franka_description xacro doesn't expose it as an argument.
#
# x = -0.08 balances two opposing constraints, both worked out from the real
# FR3 kinematics (URDF joint limits; all 7 arm joints are active revolute
# joints commanded by joint_trajectory_controller):
#  - Visibility: in its default pose the wrist and laser rod hang ~0.31 m in
#    front of the base, directly under the camera. At x = 0 they shadow ~16%
#    of the maze from the overhead camera; the shadow is 0% from x = -0.08
#    back (still 0% with the link radii inflated 30% as a safety margin).
#  - Reach: the laser tip has to get down between the 3 cm walls in every
#    cell. From the base, the tip can reach floor level between ~0.10 and
#    ~0.85 m away, comfortably (>= 10% inside every joint limit) between
#    ~0.19 and ~0.84 m. At x = -0.08 the maze spans 0.18-0.84 m from the
#    base, and all 100 cell centers plus the 4 corners are reachable with the
#    tool within 10 degrees of vertical (worst joint margin 12%). Moving the
#    base further back loses the far corners (x = -0.10 already needs ~15
#    degrees of tool tilt there); moving it closer brings the arm back into
#    the camera's view and makes the near row hard to reach.
robot:
  x: -0.08
  y: 0.0
  z: 0.0
  yaw: 0.0

# Corners of the square the maze (config/maze_layout.yaml) is rendered onto
# at launch time (see make_maze_sdf() in franka_with_overhead_camera.launch.py):
# grid x in [0, cells_per_side] -> world x in [min corner x, max corner x],
# same for y -- so moving these points moves and rescales the maze with
# them. Each point is a real-world (x, y, z) location, in meters, in the
# world frame (the robot faces +x).
#
# Only 3 of the square's 4 corners are defined below (bottom_right is left
# out) -- 3 points are all make_maze_sdf() needs to derive the square's
# bounds, and the robot's spawn position is such that the 4th corner would
# sit outside the arm's comfortable reach.
maze:
  top_left:
    x: 0.1
    y: 0.3
    z: 0.02

  top_right:
    x: 0.7
    y: 0.3
    z: 0.02

  bottom_left:
    x: 0.1
    y: -0.3
    z: 0.02
